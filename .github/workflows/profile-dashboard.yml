name: 更新个人主页数据

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: 检出个人主页仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成公开数据概览
        run: node scripts/build-profile-dashboard.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 数据变化时提交概览
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-dashboard.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 更新个人主页数据概览 [skip ci]"
          git push
name: Update profile dashboard

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate public dashboard
        run: node scripts/build-profile-dashboard.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit dashboard when data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-dashboard.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update public profile dashboard [skip ci]"
          git push
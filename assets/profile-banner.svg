<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Zeno-cc · 数据系统、产品界面、工具与知识</title>
  <desc id="desc">深蓝色个人主页横幅，以数据网格、趋势线和胶片齿孔作为视觉元素。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.56" stop-color="#102033"/>
      <stop offset="1" stop-color="#173047"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.73" cy="0.38" r="0.52">
      <stop offset="0" stop-color="#31c8c2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#31c8c2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9db0c4" stroke-opacity="0.09"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#31c8c2"/>
      <stop offset="1" stop-color="#f3b55b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="url(#grid)" stroke="#9db0c4" stroke-opacity="0.22"/>

  <rect x="56" y="54" width="5" height="208" rx="2.5" fill="#f3b55b"/>

  <text x="88" y="86" fill="#8fa6bb"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, system-ui, sans-serif"
        font-size="16" font-weight="600" letter-spacing="3">ZENO-CC · 个人工作台</text>

  <text x="84" y="154" fill="#f6f9fc"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, system-ui, sans-serif"
        font-size="46" font-weight="700">数据系统 · 产品界面</text>
  <text x="84" y="212" fill="#f6f9fc"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, system-ui, sans-serif"
        font-size="46" font-weight="700">工具与知识</text>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="88" y="238" width="88" height="30" rx="15" fill="#31c8c2" fill-opacity="0.13" stroke="#31c8c2" stroke-opacity="0.42"/>
    <text x="132" y="258" fill="#7de0d5" text-anchor="middle">梳理</text>
    <rect x="188" y="238" width="88" height="30" rx="15" fill="#6ea8fe" fill-opacity="0.11" stroke="#6ea8fe" stroke-opacity="0.38"/>
    <text x="232" y="258" fill="#a9c9ff" text-anchor="middle">构建</text>
    <rect x="288" y="238" width="88" height="30" rx="15" fill="#f3b55b" fill-opacity="0.11" stroke="#f3b55b" stroke-opacity="0.38"/>
    <text x="332" y="258" fill="#f5cc8b" text-anchor="middle">验证</text>
  </g>

  <g transform="translate(760 48)">
    <rect width="354" height="224" rx="20" fill="#07101c" fill-opacity="0.60" stroke="#9db0c4" stroke-opacity="0.24"/>
    <text x="26" y="34" fill="#8fa6bb"
          font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, system-ui, sans-serif"
          font-size="12" font-weight="600" letter-spacing="1">数据 / 界面 / 知识</text>
    <path d="M26 176H328M26 132H328M26 88H328M26 48H328" stroke="#9db0c4" stroke-opacity="0.12"/>
    <path d="M26 48V188M102 48V188M178 48V188M254 48V188M328 48V188" stroke="#9db0c4" stroke-opacity="0.09"/>
    <path d="M26 170L72 152L111 160L151 111L190 124L230 83L270 94L328 58" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 170L72 152L111 160L151 111L190 124L230 83L270 94L328 58V188H26Z" fill="#31c8c2" fill-opacity="0.07"/>
    <circle cx="151" cy="111" r="5" fill="#31c8c2"/>
    <circle cx="230" cy="83" r="5" fill="#f3b55b"/>
    <circle cx="328" cy="58" r="5" fill="#f6f9fc"/>
  </g>

  <g fill="none" stroke="#f6f9fc" stroke-opacity="0.42" stroke-width="1.8">
    <circle cx="1163" cy="28" r="7"/><circle cx="1163" cy="54" r="7"/>
    <circle cx="1163" cy="80" r="7"/><circle cx="1163" cy="106" r="7"/>
    <circle cx="1163" cy="132" r="7"/><circle cx="1163" cy="158" r="7"/>
    <circle cx="1163" cy="184" r="7"/><circle cx="1163" cy="210" r="7"/>
    <circle cx="1163" cy="236" r="7"/><circle cx="1163" cy="262" r="7"/>
    <circle cx="1163" cy="288" r="7"/>
  </g>
</svg>
